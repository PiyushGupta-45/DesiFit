name: desi_fit
description: Indian diet and workout tracker with a glassmorphism and liquid glass UI.
publish_to: "none"
version: 1.0.3+4

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.3.2
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  flutter_timezone: ^3.0.1
  http: ^1.3.0
  package_info_plus: ^8.3.0
  ota_update: ^7.1.0
  flutter_secure_storage: ^10.3.0
  google_sign_in: ^6.2.2
  flutter_dotenv: ^5.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - config/app.env
